name: CI

on:
  push:
    branches: [main, "hackathon/**"]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,vision,linq]" -c constraints.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

  training-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately minimal: dataset builders + metric helpers need only
      # stdlib + PIL + PyYAML. No weights, no torch, no network.
      - name: Install
        run: python -m pip install pytest pillow pyyaml

      - name: Test
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e "./backend[dev,vision]" -c backend/constraints.txt
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python backend/scripts/download_model.py
      - run: |
          DATABASE_URL="sqlite:////tmp/e2e/db.sqlite" DATA_DIR=/tmp/e2e/data API_TOKEN=e2e-master-123 PUBLIC_URL=http://127.0.0.1:8002 EXTRA_ORIGINS=http://127.0.0.1:8002 nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 --app-dir backend > /tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8002/health && break || sleep 2; done
      - run: python e2e/test_phone_flow.py --base http://127.0.0.1:8002 --master e2e-master-123
      - run: python e2e/test_workspace.py --base http://127.0.0.1:8002 --master e2e-master-123
